Register a new user account
---
tags:
  - Authentication
summary: Register a new user
description: Create a new user account with email, full name, and password. Email must be unique and password must be at least 6 characters.
consumes:
  - application/json
  - application/x-www-form-urlencoded
produces:
  - application/json
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - email
        - full_name
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: User's email address (must be unique)
        full_name:
          type: string
          minLength: 1
          example: "John Doe"
          description: User's full name
        password:
          type: string
          format: password
          minLength: 6
          example: "password123"
          description: Password (minimum 6 characters)
responses:
  201:
    description: User registered successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "User registered successfully"
  400:
    description: Invalid email or password format
    schema:
      $ref: '#/definitions/Error'
  409:
    description: Email already registered
    schema:
      $ref: '#/definitions/Error'
  500:
    description: Internal server error
    schema:
      $ref: '#/definitions/Error'

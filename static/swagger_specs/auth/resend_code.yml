Resend email verification code
---
tags:
  - Authentication
summary: Resend verification code
description: Generate and send a new verification code to the user's email. Previous unused codes will be marked as used. Code expires in 10 minutes.
consumes:
  - application/json
  - application/x-www-form-urlencoded
produces:
  - application/json
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: User's email address
responses:
  200:
    description: Verification code resent or user already verified
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Verification code resent"
  400:
    description: User not found
    schema:
      $ref: '#/definitions/Error'
  500:
    description: Failed to send verification email or server error
    schema:
      $ref: '#/definitions/Error'

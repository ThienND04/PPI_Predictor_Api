Authenticate user and receive JWT token
---
tags:
  - Authentication
summary: User login
description: Validate user credentials and return a JWT token for authenticated requests. Token expires after 60 hours.
consumes:
  - application/json
  - application/x-www-form-urlencoded
produces:
  - application/json
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: User's registered email address
        password:
          type: string
          format: password
          example: "password123"
          description: User's password
responses:
  200:
    description: Login successful
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          description: JWT token for authentication (60-hour expiration)
  400:
    description: Invalid email or password format
    schema:
      $ref: '#/definitions/Error'
  401:
    description: Invalid password
    schema:
      $ref: '#/definitions/Error'
  404:
    description: Email not found
    schema:
      $ref: '#/definitions/Error'
  500:
    description: Internal server error
    schema:
      $ref: '#/definitions/Error'

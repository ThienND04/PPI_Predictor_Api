Reset password with OTP
---
tags:
  - Authentication
summary: Reset password
description: Reset user password using the OTP code received via email
consumes:
  - application/json
  - application/x-www-form-urlencoded
produces:
  - application/json
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - email
        - otp_code
        - new_password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: User's email address
        otp_code:
          type: string
          example: "123456"
          description: 6-digit OTP code received via email
        new_password:
          type: string
          format: password
          minLength: 6
          example: "newpassword123"
          description: New password (minimum 6 characters)
responses:
  200:
    description: Password reset successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Password reset successfully"
  400:
    description: Invalid/expired OTP or invalid password format
    schema:
      $ref: '#/definitions/Error'
  404:
    description: Email not found
    schema:
      $ref: '#/definitions/Error'
  500:
    description: Internal server error
    schema:
      $ref: '#/definitions/Error'

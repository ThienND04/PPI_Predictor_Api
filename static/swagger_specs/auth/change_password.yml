Change password with verification
---
tags:
  - Authentication
summary: Change password
description: Change user password with old password verification. New password must be different from the old one.
consumes:
  - application/json
  - application/x-www-form-urlencoded
produces:
  - application/json
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - email
        - old_password
        - new_password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: User's email address
        old_password:
          type: string
          format: password
          example: "oldpassword123"
          description: Current password
        new_password:
          type: string
          format: password
          minLength: 6
          example: "newpassword123"
          description: New password (minimum 6 characters, must be different)
responses:
  200:
    description: Password changed successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Password changed successfully"
  400:
    description: New password invalid or same as old password
    schema:
      $ref: '#/definitions/Error'
  401:
    description: Old password incorrect
    schema:
      $ref: '#/definitions/Error'
  404:
    description: User not found
    schema:
      $ref: '#/definitions/Error'
  500:
    description: Internal server error
    schema:
      $ref: '#/definitions/Error'
